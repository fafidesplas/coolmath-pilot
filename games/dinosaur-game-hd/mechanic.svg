<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 270" width="480" height="270" shape-rendering="crispEdges">
  <!-- Dinosaur Game: Cool Edition: two lanes from the same seed. P1 (day) jumps a cactus through a egg arc; P2 (night) ducks a pterodactyl. Loop 4s. -->
  <defs>
    <!-- Running dino, 48x48, feet at y=48, color from currentColor -->
    <symbol id="dino" viewBox="0 0 48 48" width="48" height="48" overflow="visible">
      <rect x="20" y="0" width="24" height="12" fill="currentColor"/>
      <rect x="26" y="3" width="5" height="5" fill="#ffffff"/>
      <rect x="28" y="4" width="3" height="3" fill="#1d2433"/>
      <rect x="20" y="12" width="16" height="4" fill="currentColor"/>
      <rect x="12" y="16" width="20" height="16" fill="currentColor"/>
      <rect x="16" y="22" width="12" height="8" fill="#ffffff" opacity="0.25"/>
      <rect x="4" y="20" width="8" height="8" fill="currentColor"/>
      <rect x="0" y="16" width="4" height="8" fill="currentColor"/>
      <rect x="32" y="20" width="6" height="4" fill="currentColor"/>
      <g>
        <animate attributeName="opacity" values="1;0" dur="0.24s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="14" y="32" width="6" height="12" fill="currentColor"/>
        <rect x="14" y="44" width="8" height="4" fill="currentColor"/>
        <rect x="24" y="32" width="6" height="6" fill="currentColor"/>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.24s" calcMode="discrete" repeatCount="indefinite"/>
        <rect x="14" y="32" width="6" height="6" fill="currentColor"/>
        <rect x="24" y="32" width="6" height="12" fill="currentColor"/>
        <rect x="24" y="44" width="8" height="4" fill="currentColor"/>
      </g>
    </symbol>

    <!-- Ducking dino, same footprint, low and long -->
    <symbol id="dinoDuck" viewBox="0 0 48 48" width="48" height="48" overflow="visible">
      <rect x="-4" y="28" width="8" height="6" fill="currentColor"/>
      <rect x="4" y="26" width="34" height="14" fill="currentColor"/>
      <rect x="34" y="22" width="22" height="12" fill="currentColor"/>
      <rect x="44" y="25" width="5" height="5" fill="#ffffff"/>
      <rect x="46" y="26" width="3" height="3" fill="#1d2433"/>
      <rect x="10" y="40" width="6" height="8" fill="currentColor"/>
      <rect x="24" y="40" width="6" height="8" fill="currentColor"/>
    </symbol>

    <!-- Cactus, 24x40 -->
    <symbol id="cactus" viewBox="0 0 24 40" width="24" height="40" overflow="visible">
      <rect x="8" y="0" width="8" height="40" fill="#2f8a4a"/>
      <rect x="10" y="2" width="2" height="34" fill="#5cc26e"/>
      <rect x="0" y="10" width="4" height="12" fill="#2f8a4a"/>
      <rect x="0" y="20" width="8" height="4" fill="#2f8a4a"/>
      <rect x="20" y="6" width="4" height="12" fill="#2f8a4a"/>
      <rect x="16" y="16" width="8" height="4" fill="#2f8a4a"/>
    </symbol>

    <!-- Egg, 10x13, wobbles -->
    <symbol id="egg" viewBox="-6 -7 12 14" width="12" height="14" overflow="visible">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="0.6s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0.5" rx="5" ry="6.5" fill="#fff6e0" stroke="#1b2340" stroke-width="1"/>
        <rect x="-2" y="-2" width="2" height="2" fill="#f08a24"/>
        <rect x="1.5" y="2" width="2" height="2" fill="#f08a24"/>
        <rect x="-3" y="-5" width="1.5" height="2.5" fill="#ffffff"/>
      </g>
    </symbol>
  </defs>

  <!-- ===== Lane 1: P1, day ===== -->
  <rect x="0" y="0" width="480" height="133" fill="#bfe3ff"/>
  <path d="M0 110 L60 92 L130 104 L210 86 L300 100 L380 88 L480 102 L480 118 L0 118 Z" fill="#f0d7a1"/>
  <rect x="0" y="118" width="480" height="15" fill="#d9a85e"/>
  <rect x="0" y="118" width="480" height="3" fill="#8a5a2b"/>
  <g fill="#8a5a2b">
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 0" dur="0.296s" repeatCount="indefinite"/>
    <rect x="10" y="125" width="8" height="2"/><rect x="50" y="125" width="8" height="2"/><rect x="90" y="125" width="8" height="2"/>
    <rect x="130" y="125" width="8" height="2"/><rect x="170" y="125" width="8" height="2"/><rect x="210" y="125" width="8" height="2"/>
    <rect x="250" y="125" width="8" height="2"/><rect x="290" y="125" width="8" height="2"/><rect x="330" y="125" width="8" height="2"/>
    <rect x="370" y="125" width="8" height="2"/><rect x="410" y="125" width="8" height="2"/><rect x="450" y="125" width="8" height="2"/>
    <rect x="490" y="125" width="8" height="2"/>
  </g>
  <!-- Clouds, slow parallax -->
  <g fill="#ffffff">
    <animateTransform attributeName="transform" type="translate" values="0 0;-60 0" dur="4s" repeatCount="indefinite"/>
    <rect x="200" y="22" width="40" height="8"/><rect x="208" y="16" width="20" height="6"/>
    <rect x="400" y="36" width="36" height="8"/><rect x="408" y="30" width="16" height="6"/>
  </g>

  <!-- Cactus + egg arc, scrolling together -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="500 0;-40 0" dur="4s" repeatCount="indefinite"/>
    <use xlink:href="#cactus" href="#cactus" x="0" y="78"/>
    <use xlink:href="#egg" href="#egg" x="-30" y="58">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.67;0.68;1" dur="4s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#egg" href="#egg" x="6" y="40">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.735;0.745;1" dur="4s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#egg" href="#egg" x="42" y="48">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.80;0.81;1" dur="4s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- P1 dino: jumps over the cactus -->
  <g transform="translate(80 70)">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
                        values="0 0;0 0;0 -58;0 0;0 0" keyTimes="0;0.62;0.75;0.9;1"
                        calcMode="spline" keySplines="0 0 1 1;0.2 0.7 0.4 1;0.6 0 0.8 0.3;0 0 1 1"/>
      <use xlink:href="#dino" href="#dino" color="#4fae4a"/>
    </g>
  </g>

  <!-- P1 tag and egg counter -->
  <rect x="10" y="8" width="30" height="16" fill="#1d2433"/>
  <text x="25" y="20" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="bold" fill="#ffffff">P1</text>
  <use xlink:href="#egg" href="#egg" x="420" y="16"/>
  <text x="432" y="20" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="bold" fill="#1d2433">×12</text>

  <!-- Divider -->
  <rect x="0" y="133" width="480" height="4" fill="#1d2433"/>

  <!-- ===== Lane 2: P2, night ===== -->
  <rect x="0" y="137" width="480" height="133" fill="#22305a"/>
  <g fill="#ffffff" opacity="0.8">
    <rect x="40" y="150" width="2" height="2"/><rect x="140" y="160" width="2" height="2"/><rect x="260" y="148" width="2" height="2"/>
    <rect x="330" y="166" width="2" height="2"/><rect x="420" y="154" width="2" height="2"/><rect x="200" y="176" width="2" height="2"/>
  </g>
  <circle cx="390" cy="160" r="10" fill="#f4f0d0" shape-rendering="auto"/>
  <circle cx="396" cy="155" r="9" fill="#22305a" shape-rendering="auto"/>
  <path d="M0 236 L60 218 L130 230 L210 212 L300 226 L380 214 L480 228 L480 245 L0 245 Z" fill="#3c4a78"/>
  <rect x="0" y="245" width="480" height="25" fill="#56497a"/>
  <rect x="0" y="245" width="480" height="3" fill="#a99bd6"/>
  <g fill="#a99bd6">
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 0" dur="0.296s" repeatCount="indefinite"/>
    <rect x="22" y="254" width="8" height="2"/><rect x="62" y="254" width="8" height="2"/><rect x="102" y="254" width="8" height="2"/>
    <rect x="142" y="254" width="8" height="2"/><rect x="182" y="254" width="8" height="2"/><rect x="222" y="254" width="8" height="2"/>
    <rect x="262" y="254" width="8" height="2"/><rect x="302" y="254" width="8" height="2"/><rect x="342" y="254" width="8" height="2"/>
    <rect x="382" y="254" width="8" height="2"/><rect x="422" y="254" width="8" height="2"/><rect x="462" y="254" width="8" height="2"/>
    <rect x="502" y="254" width="8" height="2"/>
  </g>

  <!-- Pterodactyl at head height, same speed, earlier in the loop -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
                      values="230 0;-40 0;500 0;230 0" keyTimes="0;0.5;0.5001;1"/>
    <g fill="#c4506a">
      <rect x="0" y="198" width="10" height="4"/>
      <rect x="8" y="194" width="10" height="8"/>
      <rect x="18" y="198" width="22" height="6"/>
      <rect x="38" y="200" width="6" height="4"/>
      <rect x="10" y="196" width="3" height="3" fill="#ffffff"/>
      <!-- Wing up / wing down -->
      <rect x="22" y="182" width="8" height="16">
        <animate attributeName="opacity" values="1;0" dur="0.3s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
      <rect x="22" y="204" width="8" height="12" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.3s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- P2 dino: ducks under the pterodactyl -->
  <g transform="translate(80 197)">
    <use xlink:href="#dino" href="#dino" color="#f08a3c">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.12;0.38" dur="4s" calcMode="discrete" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#dinoDuck" href="#dinoDuck" color="#f08a3c" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.12;0.38" dur="4s" calcMode="discrete" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- P2 tag -->
  <rect x="10" y="145" width="30" height="16" fill="#f4f0d0"/>
  <text x="25" y="157" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="bold" fill="#22305a">P2</text>
</svg>
