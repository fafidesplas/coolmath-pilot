<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 480 270" width="480" height="270">
  <!-- Starship Parking: an escape pod curves across space with its thruster lit, stops in a slip between two docking
       arms of a station, the resting ring fills, then DOCKED! and three stars. Loop 6 s. Poster colors from src/skin.js. -->
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFFCEC"/>
      <stop offset=".22" stop-color="#F3E6CC" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#F3E6CC" stop-opacity=".28"/>
      <stop offset="1" stop-color="#F3E6CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold">
      <stop offset="0" stop-color="#FFF4D0"/>
      <stop offset=".22" stop-color="#E9B949" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#E9B949" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E9B949" stop-opacity="0"/>
    </radialGradient>
    <g id="flare">
      <path d="M-18 0 L0 -1.1 L18 0 L0 1.1 Z M0 -18 L1.1 0 L0 18 L-1.1 0 Z" fill="#F3E6CC" opacity=".85"/>
      <circle r="6" fill="url(#glow)"/>
    </g>
    <path id="star" d="M0 -11 l3.2 6.6 7.3 1 -5.3 5.1 1.3 7.2 -6.5 -3.4 -6.5 3.4 1.3 -7.2 -5.3 -5.1 7.3 -1z"/>
    <!-- escape pod, nose along +x -->
    <path id="egg" d="M26 0 C26 -9 14 -15 0 -15 C-14 -15 -22 -9 -22 0 C-22 9 -14 15 0 15 C14 15 26 9 26 0 Z"/>
    <g id="pod">
      <path d="M-12 -11 L-27 -21 L-23 -6 Z M-12 11 L-27 21 L-23 6 Z" fill="#2A9D8F"/>
      <path d="M-21 -5 L-28 -7.5 L-28 7.5 L-21 5 Z" fill="#3D5A80"/>
      <use xlink:href="#egg" fill="#E07A3A"/>
      <path d="M-22 0 C-22 9 -14 15 0 15 C14 15 26 9 26 0 C20 7 10 10 0 10 C-12 10 -19 6 -22 0 Z" fill="#C8553D"/>
      <path d="M26 0 C26 -6 23 -10 18 -12.5 L18 12.5 C23 10 26 6 26 0 Z" fill="#F3E6CC"/>
      <circle cx="2" r="7.5" fill="#14123A"/>
      <circle cx="2" r="5.5" fill="#8FD3CF"/>
      <ellipse cx="0" cy="-2.2" rx="2.2" ry="1.2" fill="#F3E6CC"/>
    </g>
  </defs>

  <rect width="480" height="270" fill="#07091C"/>

  <!-- stars -->
  <g>
    <circle cx="30" cy="80" r="5" fill="url(#glow)"/>
    <circle cx="92" cy="128" r="4" fill="url(#glow)"/>
    <circle cx="150" cy="70" r="6" fill="url(#gold)"><animate attributeName="opacity" dur="2.3s" repeatCount="indefinite" values="1;.5;1"/></circle>
    <circle cx="186" cy="150" r="3.5" fill="url(#glow)"/>
    <circle cx="20" cy="178" r="4" fill="url(#glow)"><animate attributeName="opacity" dur="1.7s" repeatCount="indefinite" values=".6;1;.6"/></circle>
    <circle cx="120" cy="250" r="5" fill="url(#glow)"/>
    <circle cx="232" cy="248" r="4" fill="url(#gold)"/>
    <circle cx="262" cy="182" r="3.5" fill="url(#glow)"/>
    <circle cx="398" cy="70" r="4.5" fill="url(#glow)"><animate attributeName="opacity" dur="2.9s" repeatCount="indefinite" values="1;.55;1"/></circle>
    <circle cx="462" cy="96" r="3.5" fill="url(#glow)"/>
    <circle cx="380" cy="170" r="5" fill="url(#gold)"/>
    <circle cx="470" cy="160" r="4" fill="url(#glow)"/>
    <circle cx="300" cy="230" r="3.5" fill="url(#glow)"><animate attributeName="opacity" dur="2.1s" repeatCount="indefinite" values=".5;1;.5"/></circle>
    <circle cx="60" cy="230" r="3" fill="url(#glow)"/>
    <circle cx="210" cy="100" r="3" fill="url(#glow)"/>
    <use xlink:href="#flare" x="64" y="100"><animate attributeName="opacity" dur="3.1s" repeatCount="indefinite" values="1;.55;1"/></use>
    <use xlink:href="#flare" x="420" y="120" transform="translate(420 120) scale(.75) translate(-420 -120)"/>
  </g>

  <!-- ringed planet, low on the right -->
  <g transform="translate(430 250) rotate(-14)">
    <path d="M-84 0 A84 16 0 0 1 84 0" fill="none" stroke="#E9B949" stroke-width="6"/>
    <circle r="46" fill="#C8553D"/>
    <path d="M-46 0 A46 46 0 0 0 46 0 A46 30 0 0 1 -46 0 Z" fill="#8C4A3C" opacity=".6"/>
    <path d="M84 0 A84 16 0 0 1 -84 0" fill="none" stroke="#E9B949" stroke-width="6"/>
  </g>

  <!-- station along the top: cream hull, windows, two docking arms with ports -->
  <rect x="-4" y="-4" width="488" height="52" fill="#F3E6CC"/>
  <rect x="-4" y="40" width="488" height="8" fill="#D9C7A0"/>
  <g fill="#1D1B4F">
    <rect x="14" y="14" width="16" height="11" rx="4"/><rect x="46" y="14" width="16" height="11" rx="4"/>
    <rect x="110" y="14" width="16" height="11" rx="4"/><rect x="142" y="14" width="16" height="11" rx="4"/>
    <rect x="206" y="14" width="16" height="11" rx="4"/><rect x="270" y="14" width="16" height="11" rx="4"/>
    <rect x="334" y="14" width="16" height="11" rx="4"/><rect x="398" y="14" width="16" height="11" rx="4"/>
    <rect x="430" y="14" width="16" height="11" rx="4"/>
  </g>
  <g fill="#E9B949">
    <rect x="78" y="14" width="16" height="11" rx="4"/><rect x="174" y="14" width="16" height="11" rx="4"/>
    <rect x="238" y="14" width="16" height="11" rx="4"/><rect x="302" y="14" width="16" height="11" rx="4"/>
    <rect x="366" y="14" width="16" height="11" rx="4"/><rect x="462" y="14" width="16" height="11" rx="4"/>
  </g>
  <g>
    <rect x="214" y="48" width="13" height="80" fill="#F3E6CC"/><rect x="223" y="48" width="4" height="80" fill="#D9C7A0"/>
    <rect x="280" y="48" width="13" height="80" fill="#F3E6CC"/><rect x="289" y="48" width="4" height="80" fill="#D9C7A0"/>
    <rect x="346" y="48" width="13" height="80" fill="#F3E6CC"/><rect x="355" y="48" width="4" height="80" fill="#D9C7A0"/>
    <circle cx="220.5" cy="130" r="8" fill="#14123A"/><circle cx="220.5" cy="130" r="5" fill="#E9B949"/>
    <circle cx="286.5" cy="130" r="8" fill="#14123A"/><circle cx="286.5" cy="130" r="5" fill="#E9B949"/>
    <circle cx="352.5" cy="130" r="8" fill="#14123A"/><circle cx="352.5" cy="130" r="5" fill="#E9B949"/>
  </g>

  <!-- a rocket scooter already parked in the next berth -->
  <g transform="translate(253 92) rotate(-90)">
    <path d="M-8 -6 L-20 -13 L-18 -3 Z M-8 6 L-20 13 L-18 3 Z" fill="#E9B949"/>
    <path d="M24 0 C20 -6 10 -8 0 -8 L-17 -6 L-17 6 L0 8 C10 8 20 6 24 0 Z" fill="#2A9D8F"/>
    <path d="M-17 0 L-17 6 L0 8 C10 8 20 6 24 0 C14 3 4 4 -17 0 Z" fill="#1F7268"/>
    <path d="M24 0 C21 -4 17 -6 13 -7 L13 7 C17 6 21 4 24 0 Z" fill="#F3E6CC"/>
    <circle cx="3" r="4" fill="#8FD3CF"/>
  </g>

  <!-- the slip: dashed, then lit once the pod is judged inside -->
  <rect x="297" y="56" width="46" height="74" fill="#2A9D8F" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;.3;.3;0" keyTimes="0;.62;.64;.95;1"/>
  </rect>
  <rect x="297" y="56" width="46" height="74" fill="none" stroke="#F3E6CC" stroke-width="2.5" stroke-dasharray="8 6" opacity=".8"/>

  <!-- the pod's hard poster shadow, then the pod -->
  <g transform="translate(5 7)" opacity=".6">
    <g>
      <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.55;1" calcMode="spline" keySplines=".25 0 .35 1;0 0 1 1"
        path="M40 226 C 190 236, 320 244, 320 164 L 320 93"/>
      <use xlink:href="#egg" fill="#020209"/>
    </g>
  </g>
  <g>
    <animateMotion dur="6s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;.55;1" calcMode="spline" keySplines=".25 0 .35 1;0 0 1 1"
      path="M40 226 C 190 236, 320 244, 320 164 L 320 93"/>
    <!-- thruster flame: lit while it flies, out once it rests -->
    <g transform="translate(-28 0)" opacity="1">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;.42;.5;1"/>
      <g>
        <animateTransform attributeName="transform" type="scale" dur=".18s" repeatCount="indefinite" values="1 1;.72 .85;1 1"/>
        <path d="M0 -6 C-9 -6 -19 -2 -26 0 C-19 2 -9 6 0 6 Z" fill="#E07A3A"/>
        <path d="M0 -3.5 C-6 -3.5 -12 -1 -16 0 C-12 1 -6 3.5 0 3.5 Z" fill="#E9B949"/>
      </g>
    </g>
    <use xlink:href="#pod"/>
  </g>

  <!-- resting ring: fills around the pod while it holds still, then the judge -->
  <circle cx="320" cy="93" r="38" fill="none" stroke="#E9B949" stroke-width="4" stroke-linecap="round"
    stroke-dasharray="238.8" stroke-dashoffset="238.8" transform="rotate(-90 320 93)" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;.55;.56;.63;.67;1"/>
    <animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="238.8;238.8;0;0" keyTimes="0;.56;.63;1"/>
  </circle>

  <!-- DOCKED! and three stars (plain type with a drop shadow, no box) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;.64;.66;.95;1"/>
    <g font-family="Righteous, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-weight="bold" font-size="28" text-anchor="middle">
      <text x="322" y="183" fill="#C8553D">DOCKED!</text>
      <text x="320" y="180" fill="#E9B949">DOCKED!</text>
    </g>
    <g fill="#E9B949">
      <g transform="translate(292 208)"><g transform="scale(0)">
        <animateTransform attributeName="transform" type="scale" dur="6s" repeatCount="indefinite" values="0;0;1.35;1;1" keyTimes="0;.67;.70;.72;1"/>
        <use xlink:href="#star"/></g></g>
      <g transform="translate(320 208)"><g transform="scale(0)">
        <animateTransform attributeName="transform" type="scale" dur="6s" repeatCount="indefinite" values="0;0;1.35;1;1" keyTimes="0;.71;.74;.76;1"/>
        <use xlink:href="#star"/></g></g>
      <g transform="translate(348 208)"><g transform="scale(0)">
        <animateTransform attributeName="transform" type="scale" dur="6s" repeatCount="indefinite" values="0;0;1.35;1;1" keyTimes="0;.75;.78;.80;1"/>
        <use xlink:href="#star"/></g></g>
    </g>
  </g>
</svg>
