<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Shadow Shapes: drag to turn the object; its shadow on the wall widens until it fits the outline. Loop: 5s -->
  <rect width="480" height="270" fill="#121833"/>

  <!-- Lamp and light cone -->
  <polygon points="58,62 300,30 300,205" fill="#FFD25A" opacity="0.07"/>
  <circle cx="50" cy="62" r="16" fill="#FFD25A" opacity="0.2"/>
  <circle cx="50" cy="62" r="9" fill="#FFD25A"/>

  <!-- Wall -->
  <rect x="300" y="30" width="150" height="175" rx="4" fill="#232A52" stroke="#EAF0FF" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Live shadow on the wall (same width animation as the object) -->
  <g transform="translate(375 120)">
    <polygon points="-39,-13 0,-49 39,-13 39,45 -39,45" fill="#080B1C" fill-opacity="0.9">
      <animateTransform attributeName="transform" type="scale" dur="5s" repeatCount="indefinite"
                        keyTimes="0;0.1;0.35;0.6;0.9;1" values="0.34 1;0.34 1;0.7 1;1 1;1 1;0.34 1"/>
    </polygon>
    <!-- Target outline: dashed, turns solid on match -->
    <polygon points="-39,-13 0,-49 39,-13 39,45 -39,45" fill="none" stroke="#3EE6FF" stroke-width="8" opacity="0.15">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
               keyTimes="0;0.6;0.62;0.9;0.95;1" values="0.15;0.15;0.5;0.5;0.15;0.15"/>
    </polygon>
    <polygon points="-39,-13 0,-49 39,-13 39,45 -39,45" fill="none" stroke="#3EE6FF" stroke-width="2"
             stroke-dasharray="6 5" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" dur="5s" repeatCount="indefinite" calcMode="discrete"
               keyTimes="0;0.6;0.92" values="6 5;6 0;6 5"/>
    </polygon>
  </g>

  <!-- Match check -->
  <g opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
             keyTimes="0;0.6;0.63;0.88;0.93;1" values="0;0;1;1;0;0"/>
    <circle cx="430" cy="48" r="14" fill="#121833" stroke="#FFD25A" stroke-width="2.5"/>
    <path d="M423,48 l5,5 l9,-10" fill="none" stroke="#FFD25A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Object: front face scales with cos(angle), side face with sin(angle) -->
  <g transform="translate(190 120)">
    <!-- side face -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
                        keyTimes="0;0.1;0.35;0.6;0.9;1" values="10.2 0;10.2 0;21 0;30 0;30 0;10.2 0"/>
      <polygon points="0,-10 22,-18 22,27 0,35" fill="#FF5FA2" fill-opacity="0.3" stroke="#FF5FA2" stroke-width="2" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="scale" dur="5s" repeatCount="indefinite"
                          keyTimes="0;0.1;0.35;0.6;0.9;1" values="0.94 1;0.94 1;0.71 1;0.01 1;0.01 1;0.94 1"/>
      </polygon>
    </g>
    <!-- front face -->
    <g>
      <animateTransform attributeName="transform" type="scale" dur="5s" repeatCount="indefinite"
                        keyTimes="0;0.1;0.35;0.6;0.9;1" values="0.34 1;0.34 1;0.7 1;1 1;1 1;0.34 1"/>
      <polygon points="-30,-10 0,-38 30,-10 30,35 -30,35" fill="none" stroke="#B48CFF" stroke-width="8" opacity="0.2"/>
      <polygon points="-30,-10 0,-38 30,-10 30,35 -30,35" fill="#B48CFF" fill-opacity="0.3"
               stroke="#B48CFF" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Rotate hint arrow -->
  <path d="M160,172 Q190,184 220,172" fill="none" stroke="#EAF0FF" stroke-width="2" opacity="0.4"/>
  <path d="M213,168 L221,172 L215,179" fill="none" stroke="#EAF0FF" stroke-width="2" opacity="0.4" stroke-linejoin="round"/>

  <!-- Drag pointer -->
  <path d="M0,0 L0,19 L5,15 L9,23 L12.5,21.5 L8.5,13.5 L15,13.5 Z"
        fill="#EAF0FF" stroke="#121833" stroke-width="1.5" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
                      keyTimes="0;0.1;0.6;0.9;1" values="155 188;155 188;225 188;225 188;155 188"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
             keyTimes="0;0.06;0.65;0.75;0.94;1" values="0;1;1;0;0;0"/>
  </path>

  <!-- Caption -->
  <rect x="85" y="230" width="310" height="30" rx="15" fill="#000000" fill-opacity="0.55"/>
  <text x="240" y="250.5" text-anchor="middle" fill="#EAF0FF" font-size="16" font-weight="700"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Drag to rotate, match the shadow</text>
</svg>
