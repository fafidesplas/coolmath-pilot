<!DOCTYPE html><head>
<title>Gambit Defense — Level Editor</title>
<meta charset=utf-8>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0; height: 100vh; display: flex;
        background: #10141f; color: #e8e8e8;
        font: 14px system-ui, sans-serif;
    }
    #side {
        width: 330px; flex: none; overflow-y: auto; padding: 14px;
        background: #181d2b; border-right: 1px solid #2a3144;
    }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #boardWrap { flex: 1; position: relative; min-height: 0; }
    #board { position: absolute; inset: 0; width: 100%; height: 100%; }
    #hint {
        padding: 8px 14px; background: #181d2b; border-top: 1px solid #2a3144;
        color: #9aa3b8; font-size: 13px;
    }
    h1 { font-size: 18px; margin: 0 0 12px; letter-spacing: .04em; }
    h2 {
        font-size: 12px; margin: 18px 0 8px; color: #8a93a8;
        text-transform: uppercase; letter-spacing: .08em;
    }
    label { display: block; margin: 6px 0; }
    label.row { display: flex; align-items: center; gap: 8px; }
    label.row span { width: 78px; flex: none; color: #b5bccb; }
    input[type=text], input[type=number], select, textarea {
        width: 100%; padding: 5px 7px; border-radius: 4px;
        background: #0e121c; color: #e8e8e8; border: 1px solid #333c52;
        font: inherit;
    }
    input[type=number] { width: 80px; }
    button {
        padding: 6px 10px; border-radius: 4px; cursor: pointer; font: inherit;
        background: #2a3350; color: #e8e8e8; border: 1px solid #3c4768;
    }
    button:hover { background: #35406a; }
    button.on { background: #3d7a4a; border-color: #5aa56a; }
    button.primary { background: #2f6b3c; border-color: #4f9c5f; font-weight: 600; }
    .buttons { display: flex; gap: 6px; flex-wrap: wrap; }
    .lane {
        display: flex; align-items: center; gap: 8px; padding: 5px 7px; margin: 4px 0;
        border-radius: 4px; border: 1px solid #2a3144; cursor: pointer;
    }
    .lane.active { border-color: #7fb3ff; background: #1e2740; }
    .lane .swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .lane .info { flex: 1; }
    .lane label { margin: 0; font-size: 12px; color: #b5bccb; }
    .lane button { padding: 1px 7px; }
    #problems div { margin: 3px 0; font-size: 13px; }
    .err  { color: #ff7a6b; }
    .ok   { color: #7fd48c; }
    #status { margin-top: 8px; font-size: 13px; color: #9aa3b8; min-height: 18px; }
    textarea { height: 150px; font: 11px ui-monospace, monospace; resize: vertical; }
</style>
</head><body>

<div id=side>
    <h1>GAMBIT DEFENSE — LEVELS</h1>

    <label>Open
        <select id=levelSelect></select>
    </label>

    <h2>Board</h2>
    <label>Name <input id=name type=text></label>
    <label>Blurb <input id=blurb type=text></label>
    <label class=row><span>Width</span>  <input id=gridW type=number min=4 max=30></label>
    <label class=row><span>Height</span> <input id=gridH type=number min=4 max=30></label>
    <label class=row><span>Enemy HP ×</span> <input id=hpMul type=number min=.1 step=.1></label>
    <label class=row><input id=wardsOnly type=checkbox> Wards only (Alabaster/Obsidian waves)</label>

    <h2>Tools</h2>
    <div class=buttons>
        <button id=toolPath>Draw lane (L)</button>
        <button id=toolKing>Place King (K)</button>
        <button id=toolBlock>Unusable squares (B)</button>
        <button id=toolWall>Walls (W)</button>
        <button id=undo>Undo (⌘Z)</button>
    </div>

    <h2>Lanes</h2>
    <div id=lanes></div>
    <div class=buttons>
        <button id=addLane>+ New lane</button>
        <button id=clearLane>Clear active lane</button>
    </div>

    <h2>Checks</h2>
    <div id=problems></div>

    <h2>Save</h2>
    <label class=row><span>File number</span> <input id=number type=number min=1></label>
    <div id=fileName style="color:#9aa3b8;font-size:13px;margin-bottom:8px"></div>
    <div class=buttons>
        <button id=save class=primary>Save to levels folder</button>
        <button id=download>Download</button>
        <button id=copy>Copy</button>
    </div>
    <div id=status></div>
    <h2>File preview</h2>
    <textarea id=preview readonly></textarea>
</div>

<div id=main>
    <div id=boardWrap><canvas id=board></canvas></div>
    <div id=hint></div>
</div>

<script src=dist/littlejs.js></script>
<script src=constants.js></script>
<script src=levels.js></script>
<script src=editor.js></script>
</body>
