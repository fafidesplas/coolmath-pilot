<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Chess Defense: a creep walks the route (dark lane) toward the King. Each white piece attacks exactly the squares its chess move reaches: the rook down its file, the knight on its L-squares, the bishop on its diagonals. The creep is shot each time it steps onto one of those squares and falls before the King. Loop 5 s. -->
  <rect width="480" height="270" fill="#14171f"/>
  <!-- board: row 3 is the creep route -->
  <g>
    <rect x="90" y="30" width="30" height="30" fill="#c4b8a6"/>
    <rect x="120" y="30" width="30" height="30" fill="#a8957f"/>
    <rect x="150" y="30" width="30" height="30" fill="#c4b8a6"/>
    <rect x="180" y="30" width="30" height="30" fill="#a8957f"/>
    <rect x="210" y="30" width="30" height="30" fill="#c4b8a6"/>
    <rect x="240" y="30" width="30" height="30" fill="#a8957f"/>
    <rect x="270" y="30" width="30" height="30" fill="#c4b8a6"/>
    <rect x="300" y="30" width="30" height="30" fill="#a8957f"/>
    <rect x="330" y="30" width="30" height="30" fill="#c4b8a6"/>
    <rect x="360" y="30" width="30" height="30" fill="#a8957f"/>
    <rect x="90" y="60" width="30" height="30" fill="#a8957f"/>
    <rect x="120" y="60" width="30" height="30" fill="#c4b8a6"/>
    <rect x="150" y="60" width="30" height="30" fill="#a8957f"/>
    <rect x="180" y="60" width="30" height="30" fill="#c4b8a6"/>
    <rect x="210" y="60" width="30" height="30" fill="#a8957f"/>
    <rect x="240" y="60" width="30" height="30" fill="#c4b8a6"/>
    <rect x="270" y="60" width="30" height="30" fill="#a8957f"/>
    <rect x="300" y="60" width="30" height="30" fill="#c4b8a6"/>
    <rect x="330" y="60" width="30" height="30" fill="#a8957f"/>
    <rect x="360" y="60" width="30" height="30" fill="#c4b8a6"/>
    <rect x="90" y="90" width="30" height="30" fill="#c4b8a6"/>
    <rect x="120" y="90" width="30" height="30" fill="#a8957f"/>
    <rect x="150" y="90" width="30" height="30" fill="#c4b8a6"/>
    <rect x="180" y="90" width="30" height="30" fill="#a8957f"/>
    <rect x="210" y="90" width="30" height="30" fill="#c4b8a6"/>
    <rect x="240" y="90" width="30" height="30" fill="#a8957f"/>
    <rect x="270" y="90" width="30" height="30" fill="#c4b8a6"/>
    <rect x="300" y="90" width="30" height="30" fill="#a8957f"/>
    <rect x="330" y="90" width="30" height="30" fill="#c4b8a6"/>
    <rect x="360" y="90" width="30" height="30" fill="#a8957f"/>
    <rect x="90" y="120" width="30" height="30" fill="#252c41"/>
    <rect x="120" y="120" width="30" height="30" fill="#323b53"/>
    <rect x="150" y="120" width="30" height="30" fill="#252c41"/>
    <rect x="180" y="120" width="30" height="30" fill="#323b53"/>
    <rect x="210" y="120" width="30" height="30" fill="#252c41"/>
    <rect x="240" y="120" width="30" height="30" fill="#323b53"/>
    <rect x="270" y="120" width="30" height="30" fill="#252c41"/>
    <rect x="300" y="120" width="30" height="30" fill="#323b53"/>
    <rect x="330" y="120" width="30" height="30" fill="#252c41"/>
    <rect x="360" y="120" width="30" height="30" fill="#323b53"/>
    <rect x="90" y="150" width="30" height="30" fill="#c4b8a6"/>
    <rect x="120" y="150" width="30" height="30" fill="#a8957f"/>
    <rect x="150" y="150" width="30" height="30" fill="#c4b8a6"/>
    <rect x="180" y="150" width="30" height="30" fill="#a8957f"/>
    <rect x="210" y="150" width="30" height="30" fill="#c4b8a6"/>
    <rect x="240" y="150" width="30" height="30" fill="#a8957f"/>
    <rect x="270" y="150" width="30" height="30" fill="#c4b8a6"/>
    <rect x="300" y="150" width="30" height="30" fill="#a8957f"/>
    <rect x="330" y="150" width="30" height="30" fill="#c4b8a6"/>
    <rect x="360" y="150" width="30" height="30" fill="#a8957f"/>
    <rect x="90" y="180" width="30" height="30" fill="#a8957f"/>
    <rect x="120" y="180" width="30" height="30" fill="#c4b8a6"/>
    <rect x="150" y="180" width="30" height="30" fill="#a8957f"/>
    <rect x="180" y="180" width="30" height="30" fill="#c4b8a6"/>
    <rect x="210" y="180" width="30" height="30" fill="#a8957f"/>
    <rect x="240" y="180" width="30" height="30" fill="#c4b8a6"/>
    <rect x="270" y="180" width="30" height="30" fill="#a8957f"/>
    <rect x="300" y="180" width="30" height="30" fill="#c4b8a6"/>
    <rect x="330" y="180" width="30" height="30" fill="#a8957f"/>
    <rect x="360" y="180" width="30" height="30" fill="#c4b8a6"/>
    <rect x="90" y="210" width="30" height="30" fill="#c4b8a6"/>
    <rect x="120" y="210" width="30" height="30" fill="#a8957f"/>
    <rect x="150" y="210" width="30" height="30" fill="#c4b8a6"/>
    <rect x="180" y="210" width="30" height="30" fill="#a8957f"/>
    <rect x="210" y="210" width="30" height="30" fill="#c4b8a6"/>
    <rect x="240" y="210" width="30" height="30" fill="#a8957f"/>
    <rect x="270" y="210" width="30" height="30" fill="#c4b8a6"/>
    <rect x="300" y="210" width="30" height="30" fill="#a8957f"/>
    <rect x="330" y="210" width="30" height="30" fill="#c4b8a6"/>
    <rect x="360" y="210" width="30" height="30" fill="#a8957f"/>
  </g>
  <rect x="90" y="30" width="300" height="210" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="2"/>
  <!-- the route squares each piece attacks -->
  <g opacity="0.55">
    <rect x="183" y="123" width="24" height="24" rx="3" fill="#5fd17a"/>
    <rect x="213" y="123" width="24" height="24" rx="3" fill="#5fd17a"/>
    <rect x="273" y="123" width="24" height="24" rx="3" fill="#5fd17a"/>
    <rect x="333" y="123" width="24" height="24" rx="3" fill="#5fd17a"/>
  </g>
  <!-- shots: each fires when the creep stands on a square it attacks -->
  <g>
    <line x1="195" y1="55" x2="195" y2="127" stroke="#ffe680" stroke-width="3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.28;0.285;0.34;0.345;1" values="0;0;1;1;0;0"/>
    </line>
    <line x1="277" y1="83" x2="231" y2="129" stroke="#ffe680" stroke-width="3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.38;0.385;0.44;0.445;1" values="0;0;1;1;0;0"/>
    </line>
    <line x1="251" y1="185" x2="229" y2="143" stroke="#ffe680" stroke-width="3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.4;0.405;0.46;0.465;1" values="0;0;1;1;0;0"/>
    </line>
    <line x1="259" y1="185" x2="281" y2="143" stroke="#ffe680" stroke-width="3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.58;0.585;0.64;0.645;1" values="0;0;1;1;0;0"/>
    </line>
    <line x1="293" y1="83" x2="339" y2="129" stroke="#ffe680" stroke-width="3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.76;0.765;0.8;0.805;1" values="0;0;1;1;0;0"/>
    </line>
  </g>
  <!-- pieces and the King -->
  <g>
    <text x="195" y="55" font-size="30" text-anchor="middle" font-family="serif" fill="#f5f5f5" stroke="#141414" stroke-width="1.2">♜</text>
    <text x="285" y="85" font-size="30" text-anchor="middle" font-family="serif" fill="#f5f5f5" stroke="#141414" stroke-width="1.2">♝</text>
    <text x="255" y="205" font-size="30" text-anchor="middle" font-family="serif" fill="#f5f5f5" stroke="#141414" stroke-width="1.2">♞</text>
    <text x="375" y="145" font-size="30" text-anchor="middle" font-family="serif" fill="#f7c843" stroke="#141414" stroke-width="1.2">♚</text>
  </g>
  <!-- creep: walks one square every 0.5 s, loses health on each hit, falls on square 8 -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite" keyTimes="0;0.8;1" values="0,0;240,0;240,0"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.8;0.86;0.95;1" values="1;1;0;0;1"/>
    <circle cx="105" cy="135" r="9" fill="#3fd1b7" stroke="#0b0b0b" stroke-width="1.5"/>
    <rect x="93" y="116" width="24" height="4" fill="#000" opacity="0.6"/>
    <rect x="93" y="116" width="24" height="4" fill="#e04848">
      <animate attributeName="width" dur="5s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.29;0.39;0.41;0.59;0.77" values="24;19;14;10;5;0"/>
    </rect>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#e6e6e6" text-anchor="middle">
    <text x="240" y="258">A piece's chess move is its attack range</text>
  </g>
</svg>
