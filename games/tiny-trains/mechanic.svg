<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Tiny Trains: click the switch, the red train goes to the red (circle) station. Loop 5s. -->
  <rect width="480" height="270" fill="#f6efe3"/>

  <!-- Board -->
  <rect x="28" y="32" width="424" height="172" rx="10" fill="#2b2b2b" fill-opacity="0.15"/>
  <rect x="24" y="28" width="424" height="172" rx="10" fill="#f2d49b" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>

  <!-- Track: dark bed with a light rail line -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 122H200M200 122C236 122 236 68 272 68H372M200 122C236 122 236 176 272 176H372"
          stroke="#2b2b2b" stroke-width="16"/>
    <path d="M44 122H200M200 122C236 122 236 68 272 68H372M200 122C236 122 236 176 272 176H372"
          stroke="#fffaf0" stroke-width="8" stroke-dasharray="10 6"/>
  </g>

  <!-- Red station (circle symbol) -->
  <g transform="translate(398 68)">
    <rect x="-20" y="-10" width="44" height="30" rx="4" fill="#2b2b2b" fill-opacity="0.15"/>
    <rect x="-24" y="-14" width="44" height="30" rx="4" fill="#fffaf0" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-30 -12L-2 -32L26 -12Z" fill="#e8504f" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-2" cy="2" r="7" fill="#e8504f" stroke="#2b2b2b" stroke-width="2.5"/>
  </g>
  <!-- Blue station (square symbol) -->
  <g transform="translate(398 176)">
    <rect x="-20" y="-10" width="44" height="30" rx="4" fill="#2b2b2b" fill-opacity="0.15"/>
    <rect x="-24" y="-14" width="44" height="30" rx="4" fill="#fffaf0" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-30 -12L-2 -32L26 -12Z" fill="#4cb3e6" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-8" y="-4" width="12" height="12" fill="#4cb3e6" stroke="#2b2b2b" stroke-width="2.5"/>
  </g>

  <!-- Switch: arrow points down, flips up on click -->
  <g transform="translate(200 122)">
    <g transform="rotate(32)">
      <animateTransform attributeName="transform" type="rotate" dur="5s" repeatCount="indefinite"
                        values="32;32;-32;-32;32;32" keyTimes="0;0.24;0.28;0.895;0.9;1"/>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
               values="1;1;0;0;1;1" keyTimes="0;0.86;0.89;0.91;0.95;1"/>
      <path d="M0 -6H24V-13L40 0L24 13V6H0Z" fill="#ffd23f" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <circle r="10" fill="#ffd23f" stroke="#2b2b2b" stroke-width="3"/>
  </g>

  <!-- Tap ring on the switch -->
  <circle cx="200" cy="122" r="10" fill="none" stroke="#2b2b2b" stroke-width="3" opacity="0">
    <animate attributeName="r" dur="5s" repeatCount="indefinite"
             values="10;10;30;30" keyTimes="0;0.23;0.33;1"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
             values="0;0;1;0;0" keyTimes="0;0.23;0.24;0.33;1"/>
  </circle>

  <!-- Red train (circle symbol), drawn facing +x -->
  <g>
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto" calcMode="linear"
                   path="M64 122H200C236 122 236 68 272 68H350"
                   keyPoints="0;0;1;1;0;0" keyTimes="0;0.34;0.7;0.895;0.9;1"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
             values="1;1;0;0;1;1" keyTimes="0;0.86;0.89;0.91;0.95;1"/>
    <rect x="-20" y="-10" width="44" height="26" rx="8" fill="#2b2b2b" fill-opacity="0.15"/>
    <rect x="-24" y="-13" width="44" height="26" rx="8" fill="#e8504f" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-20" y="-9" width="12" height="18" rx="3" fill="#fffaf0" stroke="#2b2b2b" stroke-width="2.5"/>
    <circle cx="4" r="6" fill="#fffaf0" stroke="#2b2b2b" stroke-width="2.5"/>
    <circle cx="16" r="3.5" fill="#2b2b2b"/>
  </g>

  <!-- Arrival: check badge + sparkles over the red station -->
  <g transform="translate(398 22)">
    <g>
      <animateTransform attributeName="transform" type="scale" dur="5s" repeatCount="indefinite"
                        values="0;0;1.25;1;1;0;0" keyTimes="0;0.7;0.75;0.79;0.86;0.89;1"/>
      <circle r="14" fill="#ffd23f" stroke="#2b2b2b" stroke-width="3"/>
      <path d="M-6 0L-1.5 5L7 -5" fill="none" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g fill="#ffd23f" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round">
    <g transform="translate(360 40)">
      <path d="M0 -9L2.5 -2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5 -2.5Z">
        <animateTransform attributeName="transform" type="scale" dur="5s" repeatCount="indefinite"
                          values="0;0;1.2;0;0" keyTimes="0;0.71;0.76;0.84;1"/>
      </path>
    </g>
    <g transform="translate(436 44)">
      <path d="M0 -9L2.5 -2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5 -2.5Z">
        <animateTransform attributeName="transform" type="scale" dur="5s" repeatCount="indefinite"
                          values="0;0;1.2;0;0" keyTimes="0;0.73;0.78;0.86;1"/>
      </path>
    </g>
  </g>

  <!-- Cursor (arrow pointer, tip at origin) -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
                      values="300 230;300 230;206 128;206 128;300 230;300 230"
                      keyTimes="0;0.04;0.2;0.32;0.46;1"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;0.04;0.09;0.38;0.46;1"/>
    <path d="M3 3V27L9 21L13 30L17 28L13 19H21Z" fill="#2b2b2b" fill-opacity="0.15"/>
    <path d="M0 0V24L6 18L10 27L14 25L10 16H18Z" fill="#fffaf0" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Caption -->
  <rect x="100" y="222" width="280" height="34" rx="17" fill="#fffaf0" stroke="#2b2b2b" stroke-width="3"/>
  <text x="240" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="16" font-weight="700" fill="#2b2b2b">Flip switches to route trains</text>
</svg>
