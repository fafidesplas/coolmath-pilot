<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Pipe Pressure: click a pipe tile to rotate it; water flows and fills the tank. Loop 4.5s. -->
  <rect width="480" height="270" fill="#f6efe3"/>

  <!-- Board: 4 x 3 grid, 52px cells -->
  <rect x="140" y="40" width="208" height="156" rx="10" fill="#2b2b2b" fill-opacity="0.15"/>
  <rect x="136" y="36" width="208" height="156" rx="10" fill="#f2d49b" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  <path d="M188 36V192M240 36V192M292 36V192M136 88H344M136 140H344" stroke="#2b2b2b" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Source valve with stub pipe -->
  <rect x="112" y="104" width="26" height="20" fill="#fffaf0" stroke="#2b2b2b" stroke-width="3"/>
  <circle cx="102" cy="118" r="18" fill="#2b2b2b" fill-opacity="0.15"/>
  <circle cx="98" cy="114" r="18" fill="#4cb3e6" stroke="#2b2b2b" stroke-width="3"/>
  <path d="M98 102V126M86 114H110" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
  <!-- Stub pipe into the tank -->
  <rect x="342" y="104" width="32" height="20" fill="#fffaf0" stroke="#2b2b2b" stroke-width="3"/>

  <!-- Fixed straight tiles (cols 0, 2, 3) -->
  <g fill="#fffaf0" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round">
    <rect x="136" y="104" width="52" height="20"/>
    <rect x="240" y="104" width="104" height="20"/>
    <path d="M292 104V124" stroke-width="2"/>
  </g>

  <!-- Water already flowing to the gap, plus a leak drip -->
  <path d="M116 114H188" stroke="#4cb3e6" stroke-width="10"/>
  <path d="M190 122C186 130 190 134 192 134C194 134 198 130 192 122Z" fill="#4cb3e6" stroke="#2b2b2b" stroke-width="2" opacity="0">
    <animateTransform attributeName="transform" type="translate" dur="4.5s" repeatCount="indefinite"
                      values="0 0;0 26;0 0;0 26;0 26" keyTimes="0;0.12;0.12;0.24;1"/>
    <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
             values="1;0;1;0;0" keyTimes="0;0.12;0.12;0.24;1"/>
  </path>

  <!-- The tile the player rotates: vertical, then horizontal -->
  <g transform="translate(214 114)">
    <g transform="rotate(90)">
      <animateTransform attributeName="transform" type="rotate" dur="4.5s" repeatCount="indefinite"
                        values="90;90;180;180;90;90" keyTimes="0;0.24;0.29;0.895;0.9;1"/>
      <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
               values="1;1;0;0;1;1" keyTimes="0;0.86;0.89;0.91;0.95;1"/>
      <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#ffd23f" stroke="#2b2b2b" stroke-width="3"/>
      <rect x="-26" y="-10" width="52" height="20" fill="#fffaf0" stroke="#2b2b2b" stroke-width="3"/>
    </g>
  </g>

  <!-- Water continues once connected -->
  <path d="M188 114H374" stroke="#4cb3e6" stroke-width="10" stroke-dasharray="186" stroke-dashoffset="186">
    <animate attributeName="stroke-dashoffset" dur="4.5s" repeatCount="indefinite"
             values="186;186;0;0;186;186" keyTimes="0;0.31;0.45;0.895;0.9;1"/>
    <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
             values="1;1;0;0;1" keyTimes="0;0.86;0.89;0.9;1"/>
  </path>

  <!-- Tank: fills, then smiles -->
  <rect x="376" y="72" width="60" height="92" rx="10" fill="#2b2b2b" fill-opacity="0.15"/>
  <rect x="372" y="68" width="60" height="92" rx="10" fill="#fffaf0"/>
  <rect x="374" y="157" width="56" height="0" rx="6" fill="#4cb3e6">
    <animate attributeName="y" dur="4.5s" repeatCount="indefinite"
             values="157;157;84;84;157;157" keyTimes="0;0.45;0.64;0.86;0.89;1"/>
    <animate attributeName="height" dur="4.5s" repeatCount="indefinite"
             values="0;0;73;73;0;0" keyTimes="0;0.45;0.64;0.86;0.89;1"/>
  </rect>
  <rect x="372" y="68" width="60" height="92" rx="10" fill="none" stroke="#2b2b2b" stroke-width="3"/>
  <g opacity="0" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" fill="none">
    <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;0.63;0.66;0.86;0.89;1"/>
    <path d="M392 104V108M412 104V108"/>
    <path d="M391 120Q402 130 413 120"/>
  </g>

  <!-- Tap ring on the rotated tile -->
  <circle cx="214" cy="114" r="10" fill="none" stroke="#2b2b2b" stroke-width="3" opacity="0">
    <animate attributeName="r" dur="4.5s" repeatCount="indefinite"
             values="10;10;34;34" keyTimes="0;0.23;0.33;1"/>
    <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
             values="0;0;1;0;0" keyTimes="0;0.23;0.24;0.33;1"/>
  </circle>

  <!-- Sparkles around the full tank -->
  <g fill="#ffd23f" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round">
    <g transform="translate(446 60)">
      <path d="M0 -9L2.5 -2.5L9 0L2.5 2.5L0 9L-2.5 2.5L-9 0L-2.5 -2.5Z">
        <animateTransform attributeName="transform" type="scale" dur="4.5s" repeatCount="indefinite"
                          values="0;0;1.2;0;0" keyTimes="0;0.64;0.7;0.8;1"/>
      </path>
    </g>
    <g transform="translate(362 52)">
      <path d="M0 -8L2.5 -2.5L8 0L2.5 2.5L0 8L-2.5 2.5L-8 0L-2.5 -2.5Z">
        <animateTransform attributeName="transform" type="scale" dur="4.5s" repeatCount="indefinite"
                          values="0;0;1.2;0;0" keyTimes="0;0.67;0.73;0.83;1"/>
      </path>
    </g>
  </g>

  <!-- Cursor (arrow pointer, tip at origin) -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" dur="4.5s" repeatCount="indefinite"
                      values="300 230;300 230;222 122;222 122;300 230;300 230"
                      keyTimes="0;0.04;0.2;0.32;0.46;1"/>
    <animate attributeName="opacity" dur="4.5s" repeatCount="indefinite"
             values="0;0;1;1;0;0" keyTimes="0;0.04;0.09;0.38;0.46;1"/>
    <path d="M3 3V27L9 21L13 30L17 28L13 19H21Z" fill="#2b2b2b" fill-opacity="0.15"/>
    <path d="M0 0V24L6 18L10 27L14 25L10 16H18Z" fill="#fffaf0" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Caption -->
  <rect x="100" y="222" width="280" height="34" rx="17" fill="#fffaf0" stroke="#2b2b2b" stroke-width="3"/>
  <text x="240" y="245" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="16" font-weight="700" fill="#2b2b2b">Rotate pipes to fill tanks</text>
</svg>
