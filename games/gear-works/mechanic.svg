<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Gear Works: drag a gear onto the empty peg, it links the motor gear to the fan. Loop 4s. -->
  <rect width="480" height="270" fill="#f6efe3"/>

  <!-- Gear tray -->
  <rect x="374" y="70" width="92" height="108" rx="12" fill="#2b2b2b" opacity="0.15"/>
  <rect x="370" y="66" width="92" height="108" rx="12" fill="#fffaf2" stroke="#2b2b2b" stroke-width="3"/>

  <!-- Static shadows -->
  <circle cx="96" cy="124" r="52" fill="#2b2b2b" opacity="0.15"/>
  <circle cx="260" cy="124" r="52" fill="#2b2b2b" opacity="0.15"/>

  <!-- Empty peg slot -->
  <circle cx="174" cy="120" r="30" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="6 6" opacity="0.45"/>
  <circle cx="174" cy="120" r="5" fill="#2b2b2b"/>

  <!-- Motor gear (always turning clockwise) -->
  <g transform="translate(92 120)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="4s" repeatCount="indefinite"
                        values="0;360" keyTimes="0;1"/>
      <circle r="48" fill="none" stroke="#2b2b2b" stroke-width="12" stroke-dasharray="12.57 12.57"/>
      <circle r="44" fill="#4aa3df" stroke="#2b2b2b" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-32" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
      <circle r="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>
    </g>
  </g>

  <!-- Target fan gear (turns only once linked) -->
  <g transform="translate(256 120)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="4s" repeatCount="indefinite"
                        values="0;0;180;180" keyTimes="0;0.4;0.9;1"/>
      <circle r="48" fill="none" stroke="#2b2b2b" stroke-width="12" stroke-dasharray="12.57 12.57"/>
      <circle r="44" fill="#ef5b5b" stroke="#2b2b2b" stroke-width="3"/>
      <g fill="#ffffff" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round">
        <path d="M0 0 C 8 -12 8 -28 0 -34 C -8 -28 -8 -12 0 0 Z"/>
        <path d="M0 0 C 8 -12 8 -28 0 -34 C -8 -28 -8 -12 0 0 Z" transform="rotate(90)"/>
        <path d="M0 0 C 8 -12 8 -28 0 -34 C -8 -28 -8 -12 0 0 Z" transform="rotate(180)"/>
        <path d="M0 0 C 8 -12 8 -28 0 -34 C -8 -28 -8 -12 0 0 Z" transform="rotate(270)"/>
      </g>
      <circle r="7" fill="#ffc93c" stroke="#2b2b2b" stroke-width="3"/>
    </g>
  </g>

  <!-- Dragged gear: tray -> peg, then turns counter-clockwise -->
  <g transform="translate(416 120)">
    <animateMotion dur="4s" repeatCount="indefinite" calcMode="linear"
                   path="M0 0 Q -116 -120 -242 0"
                   keyPoints="0;0;1;1;0;0" keyTimes="0;0.08;0.36;0.92;0.93;1"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
             values="1;1;0;0;1" keyTimes="0;0.88;0.92;0.94;1"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="4s" repeatCount="indefinite"
                        values="0;0;-264;-264;0;0" keyTimes="0;0.4;0.9;0.92;0.93;1"/>
      <circle r="34" fill="none" stroke="#2b2b2b" stroke-width="12" stroke-dasharray="13.35 13.35"/>
      <circle r="30" fill="#ffc93c" stroke="#2b2b2b" stroke-width="3"/>
      <circle r="7" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>
    </g>
    <!-- Pointer holding the gear -->
    <g transform="translate(6 6)">
      <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
               values="1;1;0;0;1" keyTimes="0;0.36;0.4;0.93;1"/>
      <path d="M0 0 L0 24 L6 18 L11 28 L16 26 L11 16 L19 16 Z"
            fill="#ffffff" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Success sparkle by the fan -->
  <g transform="translate(316 58)">
    <g transform="scale(0)">
      <animateTransform attributeName="transform" type="scale" dur="4s" repeatCount="indefinite"
                        values="0;0;1.3;1;1;0;0" keyTimes="0;0.44;0.48;0.51;0.62;0.66;1"/>
      <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z" fill="#ffc93c"
            stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
      <path d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="#5cc46b"
            stroke="#2b2b2b" stroke-width="2.5" stroke-linejoin="round" transform="translate(20 22)"/>
    </g>
  </g>

  <!-- Caption -->
  <rect x="120" y="226" width="240" height="32" rx="16" fill="#fffaf2" stroke="#2b2b2b" stroke-width="3"/>
  <text x="240" y="247" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2b2b"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Drop a gear, the fan spins</text>
</svg>
