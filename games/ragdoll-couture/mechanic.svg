<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Ragdoll Couture: drag to aim, the ragdoll model flies and flails, click to snap at the top, land on cushions, the print grades A. Loop 5 s. -->
  <rect width="480" height="270" fill="#2a2830"/>

  <!-- studio: blush backdrop paper with its roll, floor sweep -->
  <rect x="16" y="14" width="448" height="200" fill="#f8d3d8"/>
  <rect x="12" y="8" width="456" height="10" rx="4" fill="#3a3742"/>
  <rect x="16" y="196" width="448" height="74" fill="#e3a1ac"/>

  <!-- cushions along the floor -->
  <g stroke="#1d1b22" stroke-width="3" stroke-linejoin="round">
    <rect x="22" y="186" width="56" height="28" rx="12" fill="#f4c7d0"/>
    <rect x="80" y="186" width="56" height="28" rx="12" fill="#c9e4de"/>
    <rect x="138" y="186" width="56" height="28" rx="12" fill="#f6e7b0"/>
    <rect x="196" y="186" width="56" height="28" rx="12" fill="#cdd5f3"/>
    <rect x="254" y="186" width="56" height="28" rx="12" fill="#f9d9c4"/>
    <rect x="312" y="186" width="56" height="28" rx="12" fill="#f4c7d0"/>
    <rect x="428" y="186" width="34" height="28" rx="12" fill="#f6e7b0"/>
  </g>
  <!-- the landing cushion squashes -->
  <g transform="translate(398 214)">
    <g>
      <animateTransform attributeName="transform" type="scale" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.62;0.65;0.72;1" values="1 1;1 1;1.12 0.65;1 1;1 1"/>
      <rect x="-28" y="-28" width="56" height="28" rx="12" fill="#c9e4de" stroke="#1d1b22" stroke-width="3"/>
    </g>
  </g>

  <!-- aim: dashed drag line and dotted flight preview -->
  <line x1="110" y1="152" x2="110" y2="152" stroke="#1d1b22" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round" opacity="0">
    <animate attributeName="x2" dur="5s" repeatCount="indefinite" keyTimes="0;0.04;0.2;1" values="110;110;165;165"/>
    <animate attributeName="y2" dur="5s" repeatCount="indefinite" keyTimes="0;0.04;0.2;1" values="152;152;107;107"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.06;0.08;0.24;0.25;1" values="0;0;1;1;0;0"/>
  </line>
  <g fill="#e9c46a" stroke="#1d1b22" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.12;0.16;0.24;0.25;1" values="0;0;1;1;0;0"/>
    <circle cx="140" cy="126" r="5"/>
    <circle cx="169" cy="100" r="4.5"/>
    <circle cx="198" cy="82" r="4"/>
    <circle cx="227" cy="72" r="3.5"/>
  </g>

  <!-- the ragdoll: pelvis at the origin, flies an arc and spins -->
  <g>
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear"
      path="M110 160 Q260 -30 390 176"
      keyPoints="0;0;0.4;0.6;1;1;0;0" keyTimes="0;0.24;0.36;0.5;0.62;0.88;0.9;1"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
      keyTimes="0;0.86;0.88;0.92;0.96;1" values="1;1;0;0;1;1"/>
    <g transform="scale(1.3)">
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.24;0.62;0.88;0.9;1" values="0;0;-450;-450;0;0"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- back arm -->
        <g transform="translate(0 -16)"><g>
          <animateTransform attributeName="transform" type="rotate" dur="5s" repeatCount="indefinite"
            keyTimes="0;0.24;0.33;0.43;0.52;0.62;0.88;0.9;1" values="0;0;140;100;160;60;60;0;0"/>
          <polyline points="0,0 5,9 3,18" stroke="#1d1b22" stroke-width="8"/>
          <polyline points="0,0 5,9 3,18" stroke="#f4f1ea" stroke-width="5"/>
        </g></g>
        <!-- legs -->
        <g><animateTransform attributeName="transform" type="rotate" dur="5s" repeatCount="indefinite"
            keyTimes="0;0.24;0.34;0.44;0.54;0.62;0.88;0.9;1" values="0;0;-60;-95;-40;-70;-70;0;0"/>
          <polyline points="0,0 4,10 3,20" stroke="#1d1b22" stroke-width="9"/>
          <polyline points="0,0 4,10 3,20" stroke="#4a6fa5" stroke-width="6"/>
        </g>
        <g><animateTransform attributeName="transform" type="rotate" dur="5s" repeatCount="indefinite"
            keyTimes="0;0.24;0.34;0.44;0.54;0.62;0.88;0.9;1" values="0;0;50;20;70;30;30;0;0"/>
          <polyline points="0,0 -4,10 -3,20" stroke="#1d1b22" stroke-width="9"/>
          <polyline points="0,0 -4,10 -3,20" stroke="#4a6fa5" stroke-width="6"/>
        </g>
        <!-- torso -->
        <line x1="0" y1="0" x2="0" y2="-17" stroke="#1d1b22" stroke-width="13"/>
        <line x1="0" y1="0" x2="0" y2="-17" stroke="#f4f1ea" stroke-width="10"/>
        <!-- front arm -->
        <g transform="translate(0 -16)"><g>
          <animateTransform attributeName="transform" type="rotate" dur="5s" repeatCount="indefinite"
            keyTimes="0;0.24;0.33;0.43;0.52;0.62;0.88;0.9;1" values="0;0;-120;-170;-90;-40;-40;0;0"/>
          <polyline points="0,0 -5,9 -3,18" stroke="#1d1b22" stroke-width="8"/>
          <polyline points="0,0 -5,9 -3,18" stroke="#f4f1ea" stroke-width="5"/>
        </g></g>
      </g>
      <!-- head and hair -->
      <circle cx="0" cy="-26" r="7.5" fill="#f1c9a5" stroke="#1d1b22" stroke-width="2.5"/>
      <path d="M-8 -26 A8 8 0 0 1 8 -26 Z" fill="#5a3a22" stroke="#1d1b22" stroke-width="2.5" stroke-linejoin="round"/>
    </g></g>
  </g>

  <!-- viewfinder brackets around the top of the arc -->
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.28;0.32;0.5;0.56;1" values="0;0;1;1;0;0"/>
    <path d="M215 35V21H229M281 21H295V35M295 103V117H281M229 117H215V103"/>
    <path d="M249 69H261M255 63V75" stroke-width="2"/>
  </g>

  <!-- cursor: drags to aim, then clicks in the viewfinder -->
  <g opacity="0">
    <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
      keyTimes="0;0.04;0.2;0.25;0.4;0.56;1" values="112 154;112 154;167 109;167 109;268 84;268 84;268 84"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.02;0.05;0.5;0.56;1" values="0;0;1;1;0;0"/>
    <path d="M0 0V24L6 18L10 27L14 25L10 16H18Z" fill="#fffaf0" stroke="#1d1b22" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- shutter flash -->
  <rect x="16" y="14" width="448" height="256" fill="#fff" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.44;0.45;0.5;1" values="0;0;0.85;0;0"/>
  </rect>

  <!-- the print, graded A -->
  <g transform="translate(72 70)">
    <g>
      <animateTransform attributeName="transform" type="scale" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.64;0.69;0.73;0.84;0.88;1" values="0;0;1.15;1;1;0;0"/>
      <g transform="rotate(-6)">
        <rect x="-26" y="-32" width="52" height="64" rx="2" fill="#fbfaf6" stroke="#1d1b22" stroke-width="3"/>
        <rect x="-20" y="-26" width="40" height="42" fill="#f8d3d8"/>
        <path d="M-8 -6L0 2L10 -8M0 2V12M-6 18L0 12L8 16" fill="none" stroke="#1d1b22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="-6" cy="-14" r="4" fill="#f1c9a5" stroke="#1d1b22" stroke-width="2"/>
      </g>
      <circle cx="26" cy="-30" r="14" fill="#e9c46a" stroke="#1d1b22" stroke-width="3"/>
      <text x="26" y="-24" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#1d1b22">A</text>
    </g>
  </g>

  <!-- caption -->
  <rect x="110" y="226" width="260" height="32" rx="16" fill="#fffaf0" stroke="#1d1b22" stroke-width="3"/>
  <text x="240" y="247" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1d1b22">Fling the model, snap mid-air</text>
</svg>
