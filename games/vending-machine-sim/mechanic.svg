<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Vending Machine Sim: a customer walks up, thinks, buys the soda (stock drops by one, coin pops), walks off happy. Loop 6 s. -->
  <rect width="480" height="270" fill="#1b3a33"/>
  <g fill="#22483f">
    <path d="M250 0H290L170 270H130Z"/>
    <path d="M380 0H420L300 270H260Z"/>
    <path d="M510 0H550L430 270H390Z"/>
  </g>

  <!-- sidewalk -->
  <rect x="190" y="214" width="290" height="56" fill="#000" opacity="0.25"/>
  <rect x="190" y="212" width="290" height="4" fill="#181425"/>

  <!-- machine body -->
  <rect x="46" y="30" width="150" height="204" rx="6" fill="#000" opacity="0.3"/>
  <rect x="40" y="24" width="150" height="204" rx="6" fill="#e43b44" stroke="#181425" stroke-width="4"/>
  <rect x="176" y="26" width="12" height="200" fill="#a22633"/>
  <rect x="52" y="32" width="112" height="16" rx="3" fill="#181425"/>
  <rect x="62" y="38" width="92" height="4" rx="2" fill="#feae34">
    <animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="1;0.6;1"/>
  </rect>

  <!-- glass window, 2x2 slots -->
  <rect x="52" y="54" width="100" height="124" fill="#1d2b53" stroke="#181425" stroke-width="3"/>
  <rect x="55" y="57" width="46" height="58" fill="#29366f">
    <animate attributeName="fill" dur="6s" repeatCount="indefinite"
      keyTimes="0;0.34;0.35;0.39;0.4;1" values="#29366f;#29366f;#ead4aa;#ead4aa;#29366f;#29366f"/>
  </rect>
  <rect x="103" y="57" width="46" height="58" fill="#29366f"/>
  <rect x="55" y="117" width="46" height="58" fill="#29366f"/>
  <rect x="103" y="117" width="46" height="58" fill="#29366f"/>
  <g fill="#8b9bb4">
    <rect x="59" y="100" width="38" height="3"/><rect x="107" y="100" width="38" height="3"/>
    <rect x="59" y="160" width="38" height="3"/><rect x="107" y="160" width="38" height="3"/>
  </g>
  <!-- price tags -->
  <g fill="#feae34" stroke="#181425" stroke-width="2">
    <rect x="66" y="105" width="24" height="7" rx="2"/><rect x="114" y="105" width="24" height="7" rx="2"/>
    <rect x="66" y="165" width="24" height="7" rx="2"/><rect x="114" y="165" width="24" height="7" rx="2"/>
  </g>

  <!-- soda (slot 1) -->
  <g stroke="#181425" stroke-width="2.5" stroke-linejoin="round">
    <rect x="70" y="70" width="16" height="26" rx="3" fill="#e43b44"/>
    <rect x="70" y="70" width="16" height="5" rx="2" fill="#c0cbdc"/>
    <path d="M74 80L82 88" stroke="#fff" stroke-width="3"/>
  </g>
  <!-- stock pips for slot 1: one empties on the sale -->
  <g fill="#fff">
    <rect x="93" y="62" width="4" height="4"/>
    <rect x="93" y="68" width="4" height="4"/>
    <rect x="93" y="74" width="4" height="4">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
        keyTimes="0;0.34;0.35;0.93;0.95;1" values="1;1;0;0;1;1"/>
    </rect>
  </g>
  <!-- chips (slot 2) -->
  <g stroke="#181425" stroke-width="2.5" stroke-linejoin="round">
    <rect x="116" y="66" width="22" height="30" rx="2" fill="#feae34"/>
    <rect x="120" y="76" width="14" height="9" fill="#e43b44"/>
  </g>
  <!-- water (slot 3) -->
  <g stroke="#181425" stroke-width="2.5" stroke-linejoin="round">
    <rect x="74" y="124" width="8" height="5" fill="#124e89"/>
    <rect x="70" y="129" width="16" height="27" rx="4" fill="#2ce8f5"/>
    <rect x="70" y="138" width="16" height="7" fill="#0099db"/>
  </g>
  <!-- candy (slot 4) -->
  <g stroke="#181425" stroke-width="2.5" stroke-linejoin="round">
    <rect x="118" y="128" width="18" height="28" rx="2" fill="#b55088"/>
    <rect x="122" y="135" width="10" height="5" fill="#fee761"/>
  </g>

  <!-- keypad -->
  <rect x="156" y="54" width="18" height="60" fill="#262b44" stroke="#181425" stroke-width="2"/>
  <g fill="#5a6988">
    <rect x="159" y="62" width="5" height="5"/><rect x="166" y="62" width="5" height="5"/>
    <rect x="159" y="70" width="5" height="5"/><rect x="166" y="70" width="5" height="5"/>
    <rect x="159" y="78" width="5" height="5"/><rect x="166" y="78" width="5" height="5"/>
  </g>
  <rect x="161" y="92" width="8" height="14" fill="#181425"/>

  <!-- pickup tray -->
  <rect x="52" y="188" width="100" height="28" fill="#181425"/>
  <rect x="56" y="191" width="92" height="21" fill="#0e0c17"/>

  <!-- soda drops into the tray -->
  <g opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
      keyTimes="0;0.34;0.35;0.6;0.64;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
      keyTimes="0;0.35;0.42;1" values="0 0;0 0;0 120;0 120" calcMode="spline"
      keySplines="0 0 1 1;0.5 0 1 1;0 0 1 1"/>
    <g stroke="#181425" stroke-width="2.5" stroke-linejoin="round">
      <rect x="70" y="70" width="16" height="26" rx="3" fill="#e43b44"/>
      <rect x="70" y="70" width="16" height="5" rx="2" fill="#c0cbdc"/>
      <path d="M74 80L82 88" stroke="#fff" stroke-width="3"/>
    </g>
  </g>
  <rect x="52" y="208" width="100" height="8" fill="#a22633" stroke="#181425" stroke-width="2"/>

  <!-- customer: walks in, waits, walks off -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
      keyTimes="0;0.2;0.62;0.82;1" values="290 0;0 0;0 0;290 0;290 0"/>
    <g stroke="#181425" stroke-width="3" stroke-linejoin="round">
      <rect x="236" y="186" width="8" height="24" fill="#3a4466"/>
      <rect x="248" y="186" width="8" height="24" fill="#3a4466"/>
      <rect x="232" y="156" width="28" height="32" rx="4" fill="#63c74d"/>
      <rect x="234" y="130" width="24" height="26" rx="5" fill="#e4a672"/>
      <path d="M232 138V130Q246 120 260 130V138Q246 132 232 138Z" fill="#733e39"/>
    </g>
    <rect x="239" y="141" width="3" height="4" fill="#181425"/>
    <rect x="250" y="141" width="3" height="4" fill="#181425"/>

    <!-- thinking bubble -->
    <g opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
        keyTimes="0;0.2;0.21;0.33;0.34;1" values="0;0;1;1;0;0"/>
      <rect x="226" y="96" width="40" height="22" rx="6" fill="#fff" stroke="#181425" stroke-width="3"/>
      <path d="M242 118L246 126L250 118" fill="#fff" stroke="#181425" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#5a6988"><circle cx="237" cy="107" r="2.5"/><circle cx="246" cy="107" r="2.5"/><circle cx="255" cy="107" r="2.5"/></g>
    </g>
    <!-- happy bubble: soda + heart -->
    <g opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
        keyTimes="0;0.4;0.41;0.7;0.72;1" values="0;0;1;1;0;0"/>
      <rect x="222" y="94" width="48" height="26" rx="6" fill="#fff" stroke="#181425" stroke-width="3"/>
      <path d="M242 120L246 128L250 120" fill="#fff" stroke="#181425" stroke-width="3" stroke-linejoin="round"/>
      <rect x="229" y="99" width="10" height="16" rx="2" fill="#e43b44" stroke="#181425" stroke-width="2"/>
      <path d="M256 115L248 107A4 4 0 0 1 256 102A4 4 0 0 1 264 107Z" fill="#e43b44" stroke="#181425" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- coin pops up from the sale -->
  <g opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
      keyTimes="0;0.38;0.4;0.52;0.58;1" values="0;0;1;1;0;0"/>
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
      keyTimes="0;0.38;0.58;1" values="0 0;0 0;0 -36;0 -36"/>
    <circle cx="296" cy="140" r="11" fill="#feae34" stroke="#181425" stroke-width="3"/>
    <circle cx="296" cy="140" r="5" fill="none" stroke="#fee761" stroke-width="2.5"/>
  </g>

  <!-- caption -->
  <rect x="240" y="230" width="200" height="30" rx="15" fill="#ead4aa" stroke="#181425" stroke-width="3"/>
  <text x="340" y="250" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#181425">Stock it, price it, sell it</text>
</svg>
