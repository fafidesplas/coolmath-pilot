<!DOCTYPE html><head>
<title>Boat Editor - Dock All The Boats</title>
<meta charset=utf-8>
<meta name=viewport content="width=device-width, initial-scale=1">
<style>
html, body { background: #8CD6D1; margin: 0; overflow: hidden; }
.be-panel { position: fixed; top: 0; bottom: 0; overflow-y: auto; z-index: 10; box-sizing: border-box; padding: 10px 12px 40px;
    background: #FFF7E5; color: #2B2D42; font: 13px/1.35 -apple-system, 'Segoe UI', sans-serif; }
#be-left { left: 0; width: 250px; border-right: 2px solid #2B2D42; }
#be-right { right: 0; width: 330px; border-left: 2px solid #2B2D42; }
.be-panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 6px; opacity: .7; }
.be-panel h2:first-child { margin-top: 2px; }
.be-row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.be-row:hover { background: rgba(43,45,66,.07); }
.be-row.on { background: #4088ff; color: #fff; }
.be-row .k { opacity: .55; font-size: 11px; margin-left: auto; }
.be-row .lbl { overflow: hidden; text-overflow: ellipsis; }
.be-sw { width: 12px; height: 12px; border: 1.5px solid #2B2D42; border-radius: 3px; flex: none; }
.be-dot { width: 7px; height: 7px; border-radius: 50%; background: #F2635F; flex: none; }
.be-btns { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.be-panel button { font: inherit; font-size: 12px; padding: 3px 8px; border: 1.5px solid #2B2D42; border-radius: 5px; background: #fff; color: #2B2D42; cursor: pointer; }
.be-panel button:hover { background: #FFCC47; }
.be-panel button.primary { background: #33949E; color: #fff; }
.be-f { display: grid; grid-template-columns: 78px 1fr; align-items: center; gap: 4px 8px; margin: 3px 0; }
.be-f label { font-size: 12px; opacity: .8; }
.be-f input[type=number], .be-f input[type=text], .be-f select, .be-panel textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 12px; padding: 2px 4px; border: 1px solid #b9b3a5; border-radius: 4px; background: #fff; }
.be-panel textarea { font-family: ui-monospace, Menlo, monospace; min-height: 70px; }
.be-pair { display: flex; gap: 4px; }
.be-pal { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.be-pal .be-sw { width: 16px; height: 16px; cursor: pointer; }
.be-pal .be-sw.on { outline: 2.5px solid #4088ff; outline-offset: 1px; }
.be-pal input[type=color] { width: 28px; height: 20px; padding: 0; border: none; background: none; }
.be-note { font-size: 12px; background: #FFCC47; border-radius: 5px; padding: 5px 7px; margin: 6px 0; }
.be-status { font-size: 12px; margin: 8px 0; min-height: 16px; color: #33949E; font-weight: 600; }
.be-keys { font-size: 11.5px; opacity: .75; columns: 1; }
.be-keys b { display: inline-block; min-width: 72px; }
</style>
</head><body>
<script src=../dist/littlejs.js></script>
<script src=../src/boats.js></script>
<script src=../src/render.js></script>
<script src=boat-editor.js></script>
</body>
