<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Echo Steps: ghost of attempt 1 holds the plate, door opens, player walks to the exit. Loop: 5s -->
  <rect width="480" height="270" fill="#121833"/>

  <!-- Floor and ceiling over the door -->
  <line x1="30" y1="190" x2="450" y2="190" stroke="#EAF0FF" stroke-width="6" opacity="0.12"/>
  <line x1="30" y1="190" x2="450" y2="190" stroke="#EAF0FF" stroke-width="2" opacity="0.7"/>
  <line x1="300" y1="106" x2="344" y2="106" stroke="#EAF0FF" stroke-width="2" opacity="0.7"/>
  <line x1="322" y1="106" x2="322" y2="40" stroke="#EAF0FF" stroke-width="2" opacity="0.7"/>

  <!-- Wire from plate to door -->
  <path d="M150,196 V210 H322 V192" fill="none" stroke="#FFD25A" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.25">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
             keyTimes="0;0.3;0.31;0.92;0.93;1" values="0.25;0.25;0.9;0.9;0.25;0.25"/>
  </path>

  <!-- Pressure plate (yellow bar) -->
  <rect x="128" y="182" width="44" height="8" rx="2" fill="none" stroke="#FFD25A" stroke-width="7" opacity="0.15">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
             keyTimes="0;0.3;0.31;0.92;0.93;1" values="0.15;0.15;0.5;0.5;0.15;0.15"/>
  </rect>
  <rect x="128" y="182" width="44" height="8" rx="2" fill="#121833" stroke="#FFD25A" stroke-width="2">
    <animate attributeName="y" dur="5s" repeatCount="indefinite"
             keyTimes="0;0.3;0.31;0.92;0.93;1" values="182;182;186;186;182;182"/>
    <animate attributeName="height" dur="5s" repeatCount="indefinite"
             keyTimes="0;0.3;0.31;0.92;0.93;1" values="8;8;4;4;8;8"/>
  </rect>

  <!-- Door (pink bar), retracts upward -->
  <g>
    <rect x="314" y="108" width="16" height="82" rx="2" fill="#FF5FA2" fill-opacity="0.25" stroke="#FF5FA2" stroke-width="2">
      <animate attributeName="height" dur="5s" repeatCount="indefinite"
               keyTimes="0;0.3;0.4;0.9;0.98;1" values="82;82;6;6;82;82"/>
    </rect>
  </g>

  <!-- Exit portal -->
  <rect x="392" y="122" width="38" height="68" rx="19" fill="none" stroke="#3EE6FF" stroke-width="7" opacity="0.15"/>
  <rect x="392" y="122" width="38" height="68" rx="19" fill="none" stroke="#3EE6FF" stroke-width="2"/>
  <g opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
             keyTimes="0;0.78;0.8;0.92;0.96;1" values="0;0;1;1;0;0"/>
    <rect x="386" y="116" width="50" height="80" rx="25" fill="#FFD25A" fill-opacity="0.15" stroke="#FFD25A" stroke-width="3"/>
    <path d="M400,98 l8,8 l16,-16" fill="none" stroke="#FFD25A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Characters (fade in/out together for a clean reset) -->
  <g opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
             keyTimes="0;0.06;0.9;0.96;1" values="0;1;1;0;0"/>

    <!-- Echo trail -->
    <line x1="60" y1="170" x2="60" y2="170" stroke="#B48CFF" stroke-width="10" stroke-linecap="round" opacity="0.15">
      <animate attributeName="x2" dur="5s" repeatCount="indefinite"
               keyTimes="0;0.3;1" values="60;150;150"/>
    </line>

    <!-- Echo (attempt 1): faded violet ghost, dashed outline -->
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
                        keyTimes="0;0.3;1" values="60 190;150 190;150 190"/>
      <rect x="-9" y="-30" width="18" height="26" rx="7" fill="#B48CFF" fill-opacity="0.2"
            stroke="#B48CFF" stroke-width="2" stroke-dasharray="4 3"/>
      <circle cy="-40" r="7" fill="#B48CFF" fill-opacity="0.2" stroke="#B48CFF" stroke-width="2" stroke-dasharray="4 3"/>
    </g>

    <!-- Player: solid cyan with glow -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="5s" repeatCount="indefinite"
                        keyTimes="0;0.36;0.78;1" values="96 190;96 190;411 190;411 190"/>
      <rect x="-9" y="-30" width="18" height="26" rx="7" fill="none" stroke="#3EE6FF" stroke-width="7" opacity="0.2"/>
      <rect x="-9" y="-30" width="18" height="26" rx="7" fill="#3EE6FF" fill-opacity="0.3" stroke="#3EE6FF" stroke-width="2.5"/>
      <circle cy="-40" r="7" fill="#3EE6FF" stroke="#3EE6FF" stroke-width="2"/>
    </g>
  </g>

  <!-- Caption -->
  <rect x="95" y="230" width="290" height="30" rx="15" fill="#000000" fill-opacity="0.55"/>
  <text x="240" y="250.5" text-anchor="middle" fill="#EAF0FF" font-size="16" font-weight="700"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Your echo holds the door open</text>
</svg>
