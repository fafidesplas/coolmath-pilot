<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Bridge Budget: drag a beam across the gap, the truck drives over. Loop 4s. -->
  <rect width="480" height="270" fill="#f6efe3"/>

  <!-- Water in the gap -->
  <rect x="150" y="185" width="180" height="30" fill="#4aa3df" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>

  <!-- Cliffs (shadow + body) -->
  <g stroke-linejoin="round">
    <rect x="-10" y="154" width="164" height="65" fill="#2b2b2b" opacity="0.15"/>
    <rect x="334" y="154" width="164" height="65" fill="#2b2b2b" opacity="0.15"/>
    <rect x="-10" y="150" width="160" height="65" fill="#c98f55" stroke="#2b2b2b" stroke-width="3"/>
    <rect x="330" y="150" width="160" height="65" fill="#c98f55" stroke="#2b2b2b" stroke-width="3"/>
  </g>

  <!-- Beam drawn from left joint to right joint -->
  <g stroke-dasharray="180 200" stroke-dashoffset="180">
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
             values="1;1;0;0;1" keyTimes="0;0.88;0.93;0.95;1"/>
    <line x1="150" y1="153" x2="330" y2="153" stroke="#2b2b2b" stroke-width="14">
      <animate attributeName="stroke-dashoffset" dur="4s" repeatCount="indefinite"
               values="180;180;0;0;180;180" keyTimes="0;0.08;0.38;0.94;0.95;1"/>
    </line>
    <line x1="150" y1="153" x2="330" y2="153" stroke="#ffc93c" stroke-width="8">
      <animate attributeName="stroke-dashoffset" dur="4s" repeatCount="indefinite"
               values="180;180;0;0;180;180" keyTimes="0;0.08;0.38;0.94;0.95;1"/>
    </line>
  </g>

  <!-- Anchor joints -->
  <circle cx="150" cy="153" r="7" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>
  <circle cx="330" cy="153" r="7" fill="#ffffff" stroke="#2b2b2b" stroke-width="3"/>

  <!-- Truck -->
  <g stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
                      values="0 0;0 0;300 0;300 0;0 0;0 0" keyTimes="0;0.42;0.78;0.93;0.94;1"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
             values="1;1;0;0;1" keyTimes="0;0.88;0.93;0.94;1"/>
    <rect x="66" y="126" width="56" height="20" rx="3" fill="#2b2b2b" opacity="0.15" stroke="none"/>
    <rect x="62" y="120" width="40" height="22" rx="3" fill="#ef5b5b"/>
    <rect x="102" y="126" width="18" height="16" rx="3" fill="#ef5b5b"/>
    <rect x="107" y="129" width="9" height="7" rx="1" fill="#ffffff" stroke-width="2"/>
    <circle cx="74" cy="143" r="7" fill="#2b2b2b"/>
    <circle cx="110" cy="143" r="7" fill="#2b2b2b"/>
  </g>

  <!-- Pointer dragging the beam -->
  <g transform="translate(150 153)">
    <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
                      values="150 153;150 153;330 153;330 153;150 153;150 153" keyTimes="0;0.08;0.38;0.92;0.93;1"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
             values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.93;1"/>
    <path d="M0 0 L0 24 L6 18 L11 28 L16 26 L11 16 L19 16 Z"
          fill="#ffffff" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Success check -->
  <g transform="translate(240 80)">
    <g transform="scale(0)">
      <animateTransform attributeName="transform" type="scale" dur="4s" repeatCount="indefinite"
                        values="0;0;1.2;1;1;0;0" keyTimes="0;0.78;0.82;0.85;0.88;0.92;1"/>
      <circle cx="3" cy="3" r="22" fill="#2b2b2b" opacity="0.15"/>
      <circle r="22" fill="#5cc46b" stroke="#2b2b2b" stroke-width="3"/>
      <path d="M-10 0 L-3 8 L11 -8" fill="none" stroke="#ffffff" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Caption -->
  <rect x="115" y="226" width="250" height="32" rx="16" fill="#fffaf2" stroke="#2b2b2b" stroke-width="3"/>
  <text x="240" y="247" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2b2b"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Build a bridge, truck crosses</text>
</svg>
