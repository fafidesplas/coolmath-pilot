<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <!-- Hop Race: two squares race to the flag. Each holds one key to charge (power bar fills, aim arc shows), releases to hop: start ground to floating block to finish. P1 lands first and wins. Loop 5 s. -->
  <rect width="480" height="270" fill="#1d1a4d"/>

  <!-- stars -->
  <g fill="#c4cde0" opacity="0.5">
    <rect x="30" y="40" width="3" height="3"/>
    <rect x="96" y="96" width="2" height="2"/>
    <rect x="160" y="30" width="3" height="3"/>
    <rect x="300" y="52" width="2" height="2"/>
    <rect x="352" y="112" width="3" height="3"/>
    <rect x="410" y="34" width="2" height="2"/>
    <rect x="458" y="88" width="3" height="3"/>
    <rect x="236" y="100" width="2" height="2"/>
  </g>

  <!-- start ground, floating block, finish ground (pits between) -->
  <g fill="#2e2452">
    <rect x="0" y="200" width="130" height="70"/>
    <rect x="190" y="160" width="80" height="24"/>
    <rect x="340" y="200" width="140" height="70"/>
  </g>
  <g fill="#2ce0e0">
    <rect x="0" y="200" width="130" height="4"/>
    <rect x="190" y="160" width="80" height="4"/>
    <rect x="340" y="200" width="140" height="4"/>
  </g>

  <!-- finish flag and checker line -->
  <rect x="430" y="164" width="3" height="36" fill="#e6e6e6"/>
  <polygon points="433,164 456,170 433,176" fill="#ffe01a"/>
  <g>
    <rect x="452" y="188" width="6" height="6" fill="#fff"/>
    <rect x="452" y="182" width="6" height="6" fill="#000"/>
    <rect x="452" y="176" width="6" height="6" fill="#fff"/>
    <rect x="452" y="194" width="6" height="6" fill="#000"/>
  </g>

  <!-- aim previews: dotted arcs while each player charges -->
  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 9">
    <path d="M60,192 Q145,60 230,152" stroke="#8fd6fa">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.12;0.13;0.30;0.31;1" values="0;0;0.8;0.8;0;0"/>
    </path>
    <path d="M230,152 Q310,70 390,192" stroke="#8fd6fa">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.56;0.57;0.70;0.71;1" values="0;0;0.8;0.8;0;0"/>
    </path>
    <path d="M36,192 Q130,40 215,152" stroke="#ffbf80">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.22;0.23;0.40;0.41;1" values="0;0;0.8;0.8;0;0"/>
    </path>
    <path d="M215,152 Q300,60 372,192" stroke="#ffbf80">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.66;0.67;0.80;0.81;1" values="0;0;0.8;0.8;0;0"/>
    </path>
  </g>

  <!-- P1 (blue, holds A) -->
  <g>
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear"
      path="M60,192 Q145,60 230,152 Q310,70 390,192"
      keyTimes="0;0.30;0.48;0.70;0.86;1" keyPoints="0;0;0.52;0.52;1;1"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
      keyTimes="0;0.02;0.97;1" values="0;1;1;0"/>
    <rect x="-8" y="-8" width="16" height="16" fill="#3cb9f5"/>
    <rect x="-4" y="-4" width="8" height="8" fill="#b0e2fb"/>
    <rect x="2" y="-3" width="3" height="3" fill="#000"/>
    <!-- power bar -->
    <rect x="-12" y="-20" width="24" height="4" fill="#000" opacity="0.5"/>
    <rect x="-12" y="-20" height="4" fill="#3cb9f5" width="0">
      <animate attributeName="width" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.12;0.30;0.301;0.56;0.70;0.701;1" values="0;0;24;0;0;20;0;0"/>
    </rect>
  </g>

  <!-- P2 (orange, holds L), a beat behind -->
  <g>
    <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear"
      path="M36,192 Q130,40 215,152 Q300,60 372,192"
      keyTimes="0;0.40;0.58;0.80;0.96;1" keyPoints="0;0;0.53;0.53;1;1"/>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
      keyTimes="0;0.02;0.97;1" values="0;1;1;0"/>
    <rect x="-8" y="-8" width="16" height="16" fill="#ff9a33"/>
    <rect x="-4" y="-4" width="8" height="8" fill="#ffd7ad"/>
    <rect x="2" y="-3" width="3" height="3" fill="#000"/>
    <rect x="-12" y="-20" width="24" height="4" fill="#000" opacity="0.5"/>
    <rect x="-12" y="-20" height="4" fill="#ff9a33" width="0">
      <animate attributeName="width" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.22;0.40;0.401;0.66;0.80;0.801;1" values="0;0;24;0;0;20;0;0"/>
    </rect>
  </g>

  <!-- HUD -->
  <g font-family="sans-serif" font-weight="bold">
    <text x="14" y="26" font-size="16" fill="#3cb9f5">P1: hold A</text>
    <text x="466" y="26" font-size="16" fill="#ff9a33" text-anchor="end">P2: hold L</text>
    <text x="240" y="236" font-size="12" fill="#c8c8c8" text-anchor="middle">hold: charge + aim · release: hop</text>
    <text x="240" y="96" font-size="28" fill="#3cb9f5" text-anchor="middle" opacity="0">P1 WINS!
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite"
        keyTimes="0;0.86;0.87;0.96;0.97;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>
